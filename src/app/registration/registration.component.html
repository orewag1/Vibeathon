<div class="max-w-3xl mx-auto p-6 bg-white shadow-2xl rounded-xl my-10">
  <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">
    Vibeathon Registration - {{ attendeeCategory }}
  </h1>
  
  <div class="flex space-x-4 mb-8">
    <button
      (click)="switchCategory('Professional')"
      [ngClass]="{
        'bg-indigo-600 text-white': attendeeCategory === 'Professional',
        'bg-gray-200 text-gray-700 hover:bg-indigo-100': attendeeCategory !== 'Professional'
      }"
      class="py-2 px-6 rounded-lg font-semibold transition duration-150"
    >
      Working Professional
    </button>
    <button
      (click)="switchCategory('Student')"
      [ngClass]="{
        'bg-indigo-600 text-white': attendeeCategory === 'Student',
        'bg-gray-200 text-gray-700 hover:bg-indigo-100': attendeeCategory !== 'Student'
      }"
      class="py-2 px-6 rounded-lg font-semibold transition duration-150"
    >
      Student
    </button>
  </div>

  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="md:col-span-1"><label class="label-text">Full Name *</label><input formControlName="fullName" type="text" class="input-field"></div>
    <div class="md:col-span-1"><label class="label-text">Email *</label><input formControlName="emailAddress" type="email" class="input-field"></div>
    <div class="md:col-span-1"><label class="label-text">Mobile *</label><input formControlName="mobileNumber" type="tel" class="input-field"></div>
    
    <ng-container *ngIf="attendeeCategory === 'Professional'">
      <div class="md:col-span-1"><label class="label-text">Company *</label><input formControlName="company" type="text" class="input-field"></div>
      <div class="md:col-span-1"><label class="label-text">Designation * (AI Key)</label><input formControlName="designation" type="text" class="input-field"></div>
    </ng-container>

    <ng-container *ngIf="attendeeCategory === 'Student'">
      <div class="md:col-span-1"><label class="label-text">College *</label><input formControlName="college" type="text" class="input-field"></div>
      <div class="md:col-span-1"><label class="label-text">UG/PG * (AI Key)</label><select formControlName="ugPg" class="input-field"><option value="UG">UG</option><option value="PG">PG</option></select></div>
      <div class="md:col-span-1"><label class="label-text">Year of Study *</label><select formControlName="yearOfStudy" class="input-field"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
    </ng-container>
    
    <div class="md:col-span-1">
      <label class="label-text">Food Choice *</label>
      <select formControlName="foodChoice" class="input-field">
        <option value="Veg">Vegetarian</option><option value="Non-Veg">Non-Vegetarian</option>
      </select>
    </div>
    
    <div class="md:col-span-2 mt-4">
      <div class="flex items-start">
        <input formControlName="optInConsent" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded mt-1">
        <label class="ml-2 block text-sm text-gray-900">I would like to receive updates & notifications...</label>
      </div>
    </div>

    <div class="md:col-span-2 mt-6">
      <button type="submit" class="w-full py-3 px-4 rounded-md shadow-lg text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700">
        Register Now
      </button>
    </div>
  </form>
</div>
