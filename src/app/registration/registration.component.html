<div class="max-w-xl mx-auto p-6 app-card my-10 text-center">
  <h1 class="text-3xl font-bold text-indigo-700 mb-6 border-b pb-2">
    Select Attendee Category
  </h1>
  <p class="text-lg text-gray-600 mb-8">
    Please choose the category that best describes you to continue.
  </p>
  
  <div class="space-y-6">
    <button (click)="selectCategory('professional')"
            class="w-full py-4 bg-indigo-600 text-white shadow-xl rounded-lg text-xl font-bold hover:bg-indigo-700 transition duration-200">
      Working Professional Registration
    </button>

    <button (click)="selectCategory('student')"
            class="w-full py-4 bg-purple-600 text-white shadow-xl rounded-lg text-xl font-bold hover:bg-purple-700 transition duration-200">
      Student Registration
    </button>
  </div>
</div>
