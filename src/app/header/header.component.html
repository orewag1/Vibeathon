<header class="bg-white shadow-xl sticky top-0 z-50 border-b-4 border-indigo-700/70"> 
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <div class="flex-shrink-0">
        <div (click)="navigateTo('/dashboard')" class="cursor-pointer">
            <span class="text-3xl font-extrabold text-indigo-700">MyTrax</span>
            <span class="text-xs text-gray-500 ml-2 block sm:inline-block">Your Path. Personalized by AI.</span>
        </div>
      </div>
      <nav class="ml-10 hidden md:block">
        <div class="flex items-baseline space-x-2">
          <button *ngFor="let item of navItems" 
                  (click)="navigateTo(item.route)"
                  class="px-4 py-2 rounded-xl text-sm font-semibold transition duration-200"
                  [ngClass]="{
                    'text-white bg-indigo-700 shadow-lg hover:bg-indigo-600': router.url === item.route,
                    'text-gray-700 hover:bg-gray-100': router.url !== item.route
                  }">
            {{ item.name }}
          </button>
        </div>
      </nav>
      <div class="md:hidden text-gray-500">Menu</div>
    </div>
  </div>
</header>
