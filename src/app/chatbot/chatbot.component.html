<div class="max-w-xl mx-auto p-6 my-10 app-card h-[80vh] flex flex-col">
  <h1 class="text-3xl font-bold text-teal-400 mb-4 border-b border-slate-700 pb-2">
    SIT Concierge Chatbot 🤖
  </h1>

  <div class="flex-1 overflow-y-auto space-y-4 p-4 border border-slate-700 rounded-lg bg-slate-900 mb-4">
    <div *ngFor="let message of messages" [ngClass]="{'justify-end': message.sender === 'user', 'justify-start': message.sender === 'bot'}" class="flex">
      <div [ngClass]="{
        'bg-teal-600 text-gray-900 rounded-br-none shadow-md': message.sender === 'user',
        'bg-slate-700 text-gray-200 rounded-tl-none shadow-md': message.sender === 'bot'
      }" class="max-w-xs p-3 rounded-xl">
        {{ message.text }}
      </div>
    </div>
    
    <div *ngIf="isTyping" class="flex justify-start">
      <div class="bg-slate-700 text-gray-400 p-3 rounded-xl rounded-tl-none">
        <span class="text-sm">Concierge is typing...</span>
      </div>
    </div>
  </div>
  
  <div class="flex items-center">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Ask a question..."
      class="flex-1 p-3 border border-slate-700 bg-slate-900 rounded-l-lg text-white focus:ring-teal-500"
    />
    <button
      (click)="sendMessage()"
      [disabled]="userInput.trim() === '' || isTyping"
      class="bg-teal-500 text-gray-900 p-3 rounded-r-lg font-semibold hover:bg-teal-400 transition duration-150 disabled:bg-gray-700"
    >
      Send
    </button>
  </div>
</div>
