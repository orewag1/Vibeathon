<div class="max-w-xl mx-auto p-6 my-10 bg-white shadow-2xl rounded-xl h-[80vh] flex flex-col">
  <h1 class="text-3xl font-bold text-gray-800 mb-4 border-b pb-2">
    SIT Concierge Chatbot 🤖
  </h1>
  <p class="text-gray-500 mb-4 text-sm">
    LLM chatbot for instant answers on sessions, venue, speakers, and FAQs.
  </p>

  <div class="flex-1 overflow-y-auto space-y-4 p-4 border rounded-lg bg-gray-50 mb-4">
    <div *ngFor="let message of messages" [ngClass]="{'justify-end': message.sender === 'user', 'justify-start': message.sender === 'bot'}" class="flex">
      <div [ngClass]="{
        'bg-indigo-600 text-white rounded-br-none': message.sender === 'user',
        'bg-gray-200 text-gray-800 rounded-tl-none': message.sender === 'bot'
      }" class="max-w-xs p-3 rounded-xl shadow-md">
        {{ message.text }}
      </div>
    </div>
    
    <div *ngIf="isTyping" class="flex justify-start">
      <div class="bg-gray-200 text-gray-600 p-3 rounded-xl rounded-tl-none shadow-md">
        <span class="text-sm">Concierge is typing...</span>
      </div>
    </div>
  </div>
  
  <div class="flex items-center">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Ask a question (e.g., 'where is the venue?')"
      class="flex-1 p-3 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
    />
    <button
      (click)="sendMessage()"
      [disabled]="userInput.trim() === '' || isTyping"
      class="bg-indigo-600 text-white p-3 rounded-r-lg hover:bg-indigo-700 transition duration-150 disabled:bg-indigo-400"
    >
      Send
    </button>
  </div>
</div>
